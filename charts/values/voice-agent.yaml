# voice-agent-specific values
fullnameOverride: voice-agent

image:
  repository: ai-apps-platform/voice-agent
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 7860

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: voice-agent.local
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "400m"
    memory: "512Mi"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70

otel:
  enabled: true
  endpoint: "http://otel-collector:4317"
  serviceName: "voice-agent"

secret:
  name: "voice-agent-secrets"
  keys:
    - GROQ_API_KEY

configMap:
  data:
    STT_BACKEND: "groq"
    PORT: "7860"

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
