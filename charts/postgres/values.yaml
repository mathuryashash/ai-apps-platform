image:
  repository: pgvector/pgvector
  tag: "pg17"
  pullPolicy: IfNotPresent

storage:
  size: 2Gi
  storageClass: standard

auth:
  database: resume_tracker
  user: postgres
  password: devpassword

service:
  port: 5432

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "300m"
    memory: "512Mi"
