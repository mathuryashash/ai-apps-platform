global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Scrape OTel collector's Prometheus exporter
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Scrape app pods via pod annotations (works in k8s via kube-discovery too)
  - job_name: apps
    static_configs:
      - targets:
          - "jobtracker:80"
          - "voice-agent:80"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __address__
