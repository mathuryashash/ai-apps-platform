receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Prometheus scrape for self-metrics
  prometheus:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 30s
          static_configs:
            - targets: ["localhost:8888"]

processors:
  # Batch traces/metrics before export — reduces overhead
  batch:
    timeout: 10s
    send_batch_size: 1024

  # Drop high-cardinality attributes that bloat storage
  attributes/sanitize:
    actions:
      - key: db.statement
        action: delete

  memory_limiter:
    check_interval: 5s
    limit_mib: 200

exporters:
  # Prometheus exposition for Prometheus scraping
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: otel

  # Debug exporter (stdout) — useful for local development
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes/sanitize]
      exporters: [debug]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
