name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: "v3.16.0"

      - name: Helm lint
        run: |
          helm lint charts/app-chart -f charts/values/jobtracker.yaml
          helm lint charts/app-chart -f charts/values/voice-agent.yaml
          helm lint charts/postgres

      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          chmod +x /usr/local/bin/kubeconform

      - name: kubeconform
        run: |
          helm template jobtracker charts/app-chart -f charts/values/jobtracker.yaml \
            | kubeconform -strict -summary
          helm template voice-agent charts/app-chart -f charts/values/voice-agent.yaml \
            | kubeconform -strict -summary
          helm template postgres charts/postgres \
            | kubeconform -strict -summary

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt + validate
        run: |
          cd infra/aws
          terraform fmt -check
          terraform init -backend=false
          terraform validate

      - name: TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: "v0.53.0"
      - run: |
          cd infra/aws
          tflint --init
          tflint

      - name: Terraform test (mock provider)
        run: |
          cd infra/aws
          terraform init -backend=false
          terraform test

      - name: promtool check rules
        run: |
          curl -sSLo /tmp/prometheus.tar.gz \
            https://github.com/prometheus/prometheus/releases/download/v3.0.1/prometheus-3.0.1.linux-amd64.tar.gz
          tar -xzf /tmp/prometheus.tar.gz -C /tmp --wildcards "*/promtool"
          mv /tmp/prometheus-*/promtool /usr/local/bin/promtool
          promtool check rules observability/rules/app-alerts.yml

      - name: actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_level: error

  build-and-smoke:
    name: Build images + kind smoke
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The jobtracker image is ~3.4 GB (ML deps); with both images the default runner
      # runs out of disk. Drop preinstalled SDKs this job never uses (~25 GB).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h /

      - name: Build jobtracker image
        run: docker build -f docker/jobtracker/Dockerfile apps/jobtracker -t ai-apps-platform/jobtracker:ci

      - name: Build voice-agent image
        run: docker build -f docker/voice-agent/Dockerfile . -t ai-apps-platform/voice-agent:ci

      - name: Image sizes
        run: |
          echo "jobtracker: $(docker image inspect ai-apps-platform/jobtracker:ci --format '{{.Size}}' | numfmt --to=iec)"
          echo "voice-agent: $(docker image inspect ai-apps-platform/voice-agent:ci --format '{{.Size}}' | numfmt --to=iec)"

      - name: Set up kind
        uses: helm/kind-action@v1
        with:
          cluster_name: ai-apps-platform
          config: kind-config.yaml

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Load images into kind
        run: |
          kind load docker-image ai-apps-platform/jobtracker:ci --name ai-apps-platform
          kind load docker-image ai-apps-platform/voice-agent:ci --name ai-apps-platform

      - name: Install ingress-nginx
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.1/deploy/static/provider/kind/deploy.yaml
          kubectl -n ingress-nginx wait --for=condition=ready pod --selector=app.kubernetes.io/component=controller --timeout=120s

      - name: Install observability
        run: kubectl apply -f scripts/observability-deploy.yaml

      - name: Install Postgres
        run: helm upgrade --install postgres charts/postgres --wait --timeout 120s

      - name: Install apps (CI — with dummy secrets)
        run: |
          kubectl create secret generic jobtracker-secrets \
            --from-literal=GROQ_API_KEY=ci-dummy \
            --from-literal=GROQ_MODEL=openai/gpt-oss-20b \
            --from-literal=DATABASE_URL="postgresql://postgres:devpassword@postgres-postgres:5432/resume_tracker" \
            --from-literal=FERNET_KEY="" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic voice-agent-secrets \
            --from-literal=GROQ_API_KEY=ci-dummy \
            --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install jobtracker charts/app-chart \
            -f charts/values/jobtracker.yaml \
            --set image.repository=ai-apps-platform/jobtracker \
            --set image.tag=ci \
            --wait --timeout 180s
          helm upgrade --install voice-agent charts/app-chart \
            -f charts/values/voice-agent.yaml \
            --set image.repository=ai-apps-platform/voice-agent \
            --set image.tag=ci \
            --wait --timeout 180s

      - name: Smoke test
        run: bash scripts/smoke.sh

      - name: Install k6
        run: |
          curl -sSLo /tmp/k6.tar.gz \
            https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz
          tar -xzf /tmp/k6.tar.gz -C /usr/local/bin --strip-components=1 k6-v0.54.0-linux-amd64/k6

      - name: k6 load test (30s)
        run: |
          mkdir -p loadtest/results
          k6 run loadtest/k6-health.js \
            --env INGRESS_URL=http://localhost:18080 \
            --duration 30s \
            --vus 5 \
            --out json=loadtest/results/k6-ci.json

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest pyyaml jsonschema

      - name: Run tests
        run: pytest tests/ -v --tb=short
